name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        run: pyinstaller build/GuitarWiring.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc build/GuitarWiring.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuitarWiring-windows
          path: |
            dist/GuitarWiring.exe
            dist/GuitarWiring-Setup.exe
