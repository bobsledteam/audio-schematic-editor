name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build app bundle
        run: python -m PyInstaller build/EndoASD-mac.spec --clean --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Endo ASD" \
            -srcfolder "dist/Endo ASD.app" \
            -ov -format UDZO \
            dist/EndoASD-mac-Bugtest.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EndoASD-mac
          path: |
            dist/Endo ASD.app
            dist/EndoASD-mac-Bugtest.dmg
