name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install -r requirements-build.txt

      - name: Build executable
        run: pyinstaller build/EndoASD.spec --clean --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc build/EndoASD.iss

      - name: Build portable bugtest zip
        shell: pwsh
        run: |
          $out = "dist/EndoASD-Windows-Bugtest"
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Path "$out/assets" | Out-Null
          $files = @(
            "index.html","app.js","assets.js","cad.js","curves.js","engines.js","errorreporting.js",
            "materials.js","gate.js","gate.css","styles.css","serve.py","updater.py",
            "update-channel.json","requirements.txt"
          )
          foreach ($f in $files) { Copy-Item $f $out }
          Copy-Item EndoASD.bat "$out/EndoASD.bat"
          Copy-Item build/BUGTEST-WINDOWS.txt "$out/README.txt"
          Copy-Item -Recurse assets/* "$out/assets/"
          if (Test-Path dist/EndoASD.exe) { Copy-Item dist/EndoASD.exe $out }
          if (Test-Path dist/EndoASD-Windows-Bugtest.zip) { Remove-Item dist/EndoASD-Windows-Bugtest.zip -Force }
          Compress-Archive -Path "$out/*" -DestinationPath dist/EndoASD-Windows-Bugtest.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EndoASD-windows
          path: |
            dist/EndoASD.exe
            dist/EndoASD-Setup.exe
            dist/EndoASD-Windows-Bugtest.zip
